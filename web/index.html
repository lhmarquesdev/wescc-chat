<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171c" />
    <title>Wescc Chat</title>
    <script>
      // Tema escolhido na conta (guardado por main.tsx): aplicado antes da primeira pintura, só se a
      // sessão aberta (wescc.auth, de lib/api.ts) for do mesmo usuário. Sem sessão (saiu), o registro é apagado.
      try {
        var t = JSON.parse(localStorage.getItem('wescc.theme') || 'null');
        var a = JSON.parse(localStorage.getItem('wescc.auth') || 'null');
        if (t && a && t.uid === a.userId) {
          if (t.theme === 'light' || t.theme === 'dark') document.documentElement.dataset.theme = t.theme;
        } else if (t !== null) localStorage.removeItem('wescc.theme');
      } catch (e) {
        try {
          localStorage.removeItem('wescc.theme');
        } catch (e2) {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
