<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f2f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1219" />
    <title>Sem conexão · Wescc Chat</title>
    <!--
      Página que o service worker (sw.js) mostra quando o servidor não responde ao abrir o app ou recarregar.
      Fica guardada no navegador, por isso tudo vem junto (sem CSS, fonte ou script de fora). Volta para o
      chat sozinha quando o servidor responde.
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: hsl(218 22% 95%);
        --fg: hsl(215 25% 15%);
        --muted: hsl(215 19% 35%);
        --card: hsl(0 0% 100%);
        --line: hsl(210 18% 90%);
        --btn: hsl(196 100% 32%);
        --btn-hover: hsl(196 100% 26%);
        --ring: hsl(196 100% 35%);
      }
      :root.dark {
        color-scheme: dark;
        --bg: hsl(222 24% 8%);
        --fg: hsl(210 20% 94%);
        --muted: hsl(218 14% 72%);
        --card: hsl(222 20% 12%);
        --line: hsl(222 14% 21%);
        --btn: hsl(196 100% 32%);
        --btn-hover: hsl(196 100% 38%);
        --ring: hsl(196 100% 55%);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        text-align: center;
      }
      svg {
        display: block;
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 8px;
        color: var(--muted);
      }
      button {
        margin-top: 16px;
        min-height: 44px;
        padding: 10px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--btn);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--btn-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
    <script>
      // Mesmo tema do chat (index.html): a escolha da conta, ou o do sistema em Automático.
      try {
        var t = JSON.parse(localStorage.getItem('wescc.theme') || 'null');
        var a = JSON.parse(localStorage.getItem('wescc.auth') || 'null');
        var theme = t && a && t.uid === a.userId ? t.theme : 'auto';
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {
        if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <main>
      <svg viewBox="-2 -17.25 114.5 114.5" stroke-linejoin="round" stroke-width="3" aria-hidden="true">
        <defs>
          <linearGradient id="fold" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#0072b0" />
            <stop offset="1" stop-color="#00b0f0" />
          </linearGradient>
        </defs>
        <g fill="url(#fold)" stroke="url(#fold)">
          <polygon points="0,0 18,0 31.6,80 13.6,80" />
          <polygon points="42.6,22 60.6,22 70.46,80 52.46,80" />
        </g>
        <g fill="#00b0f0" stroke="#00b0f0">
          <polygon points="13.6,80 31.6,80 60.6,22 42.6,22" />
          <polygon points="52.46,80 70.46,80 110.46,0 92.46,0" />
        </g>
      </svg>
      <h1>Sem conexão com o servidor do chat</h1>
      <p>Confira a sua rede. O chat abre sozinho assim que o servidor responder.</p>
      <p id="status">Tentando de novo em 5 s.</p>
      <button type="button" id="retry">Tentar agora</button>
    </main>
    <script>
      (function () {
        var WAIT = 5;
        var left = WAIT;
        var checking = false;
        var status = document.getElementById('status');
        // Abre o endereço que a pessoa pediu (o service worker mostra esta página no lugar dele).
        function open() {
          if (location.pathname === '/offline.html') location.replace('/home');
          else location.reload();
        }
        function check() {
          if (checking) return;
          checking = true;
          status.textContent = 'Tentando conectar…';
          fetch('/health', { cache: 'no-store' })
            .then(function (r) {
              if (r.ok) return open();
              throw new Error('fora do ar');
            })
            .catch(function () {
              checking = false;
              left = WAIT;
              status.textContent = 'Tentando de novo em ' + left + ' s.';
            });
        }
        setInterval(function () {
          if (checking) return;
          left -= 1;
          if (left <= 0) check();
          else status.textContent = 'Tentando de novo em ' + left + ' s.';
        }, 1000);
        document.getElementById('retry').addEventListener('click', check);
        window.addEventListener('online', check);
        // A primeira tentativa espera os 5 s: se o servidor responde mas a página não abre, não fica recarregando sem parar.
        status.textContent = 'Tentando de novo em ' + left + ' s.';
      })();
    </script>
  </body>
</html>
